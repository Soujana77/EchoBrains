<!DOCTYPE html>
<html>
    <head>
        <title>Image Gallery</title>
       
      <style>
        .gallery{
            display: grid;
            padding: 2rem;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card{
            background-color: #f1f5f9;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            padding: 0.5rem;
            overflow: hidden;

        }
         .card img{
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            border-radius: 6px;
        }
      </style>
      
    </head>
    <body>
        <div class ="gallery">
                <div class="card"><img src="laptop.jpg" ></div>
                <div class="card"><img src="mobile.jpg" ></div>
                <div class="card"><img src="tablet.jpg"></div>
                <div class="card"><img src="laptop.jpg"></div>
                <div class="card"><img src="mobile.jpg"></div>
                <div class="card"><img src="tablet.jpg"></div>
                <div class="card"><img src="laptop.jpg"></div>
                <div class="card"><img src="mobile.jpg"></div>
                <div class="card"><img src="tablet.jpg"></div>
        </div>
    </body>
</html>
