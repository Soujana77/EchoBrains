<!DOCTYPE html>
<html>
    <head>
        <title>Image Gallery</title>
       
      <style>
        .gallery{
            display:grid;
            padding:2 rem;
            grid-template-columns:repeat(auto-fit,minamx(200px,1fr));
            gap: 1.5rem;
        }

        .card{
            background-color:#f1f5f9;
            border:1px solid #cbd5e0;
            border-radius:8px;
            padding :2rem;

        }
      </style>
      
    </head>
    <body>
        <div class ="gallery">
                <div class="card"><img src="laptop.jpg" ></div>
                <div class="card"><img src="mobile.jpg" ></div>
                <div class="card"><img src="tablet.jpg"></div>
                <div class="card"><img src="laptop.jpg"></div>
                <div class="card"><img src="mobile.jpg"></div>
                <div class="card"><img src="tablet.jpg"></div>
                <div class="card"><img src="laptop.jpg"></div>
                <div class="card"><img src="mobile.jpg"></div>
                <div class="card"><img src="tablet.jpg"></div>
        </div>
    </body>
</html>
