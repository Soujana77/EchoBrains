<!DOCTYPE html>
<html>
    <head>
        <title>My Multimedia Page</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <style >
        .test{
            display:none 

        }
        .test2{
            display:block
        }
        .box{
            display:block;
            width: 240px;
            height:180px;
            background-color:lightblue;
            display:inline-block;
            margin :10px;
            border:3px solid black;

        }
        .container{
            display:flex;
            flex-direction:column;
            justify-content:center;

        }
      </style>
    </head>
    <body>
        <div class="container">
            <div class="box">
                <img src="laptop.jpg" alt="Laptop">
                <p>Laptop</p>
            </div>
            <div class="box">
                <img src="mobile.jpg" alt="Mobile">
            <p>Mobile</p>
        </div>
        <div class="box">
            <img src="tablet.jpg" alt="Tablet">
            <p>Tablet</p>
        </div>
        <h1 >CSS Display Property</h1>
        <p class="test">Display used to decide how to display an element </p>
        <p class="test2">Inline means display the elements in the same line </p>
     </body>
</html>
